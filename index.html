<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eremotherium AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; height: 100vh; background: #1a1a1a; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <model-viewer 
        src="model.glb"  <!-- Ajusta el nombre si es scene.glb -->
        ar
        ar-modes="scene-viewer quick-look"
        camera-controls
        shadow-intensity="0"
        loading="eager">
        <div slot="progress-bar">
            <div style="position: absolute; bottom: 20px; left: 20px; right: 20px; height: 20px; background: #333; border-radius: 10px; overflow: hidden;">
                <div style="width: {{progress}}%; height: 100%; background: #4CAF50; transition: width 0.3s;"></div>
            </div>
            <div style="position: absolute; bottom: 50px; left: 0; right: 0; text-align: center; color: white; font-family: Arial;">
                Cargando: {{progress}}%
            </div>
        </div>
    </model-viewer>
</body>
</html>
